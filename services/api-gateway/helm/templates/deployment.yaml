apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: delivery
  labels:
    app: api-gateway
    project: gridsense
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        project: gridsense
    spec:
      containers:
        - name: api-gateway
          image: 173679718835.dkr.ecr.us-east-1.amazonaws.com/gridsense/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: eskom-ingestor-secrets
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: API_VERSION
              value: "1.0.0"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      restartPolicy: Always