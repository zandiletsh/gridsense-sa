# .github/workflows/deploy.yml
# CI/CD Pipeline for GridSense SA
# Triggers on every push to main branch

name: Deploy GridSense Services

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: gridsense-dev
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ── Job 1: Detect which services changed ──────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      eskom-ingestor: ${{ steps.changes.outputs.eskom-ingestor }}
      data-validator: ${{ steps.changes.outputs.data-validator }}
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            eskom-ingestor:
              - 'services/eskom-ingestor/**'
            data-validator:
              - 'services/data-validator/**'
            api-gateway:
              - 'services/api-gateway/**'

  # ── Job 2: Build and Deploy Eskom Ingestor ────────────────────
  deploy-eskom-ingestor:
    name: Deploy Eskom Ingestor
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.eskom-ingestor == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: services/eskom-ingestor
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_REGISTRY/gridsense/eskom-ingestor:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/gridsense/eskom-ingestor:latest .
          docker push $ECR_REGISTRY/gridsense/eskom-ingestor:$IMAGE_TAG
          docker push $ECR_REGISTRY/gridsense/eskom-ingestor:latest
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f services/eskom-ingestor/helm/templates/configmap.yaml
          kubectl apply -f services/eskom-ingestor/helm/templates/deployment.yaml
          kubectl rollout restart deployment/eskom-ingestor -n ingestion
          kubectl rollout status deployment/eskom-ingestor -n ingestion --timeout=120s

  # ── Job 3: Build and Deploy Data Validator ────────────────────
  deploy-data-validator:
    name: Deploy Data Validator
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.data-validator == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: services/data-validator
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_REGISTRY/gridsense/data-validator:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/gridsense/data-validator:latest .
          docker push $ECR_REGISTRY/gridsense/data-validator:$IMAGE_TAG
          docker push $ECR_REGISTRY/gridsense/data-validator:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f services/data-validator/helm/templates/configmap.yaml
          kubectl apply -f services/data-validator/helm/templates/deployment.yaml
          kubectl rollout restart deployment/data-validator -n ingestion
          kubectl rollout status deployment/data-validator -n ingestion --timeout=120s

  # ── Job 4: Build and Deploy API Gateway ───────────────────────
  deploy-api-gateway:
    name: Deploy API Gateway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: services/api-gateway
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_REGISTRY/gridsense/api-gateway:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/gridsense/api-gateway:latest .
          docker push $ECR_REGISTRY/gridsense/api-gateway:$IMAGE_TAG
          docker push $ECR_REGISTRY/gridsense/api-gateway:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f services/api-gateway/helm/templates/service.yaml
          kubectl apply -f services/api-gateway/helm/templates/deployment.yaml
          kubectl rollout restart deployment/api-gateway -n delivery
          kubectl rollout status deployment/api-gateway -n delivery --timeout=120s